name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libghostty-vt is built from pinned source by build-vt.sh; kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vt
        with:
          path: Vendor/GhosttyVt.xcframework
          key: ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-vt.sh') }}

      - name: Build libghostty-vt
        if: steps.vt.outputs.cache-hit != 'true'
        run: ./scripts/build-vt.sh

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test
